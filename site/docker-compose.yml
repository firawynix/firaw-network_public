services:
  ipscan-site:
    image: nginx:1.27-alpine
    container_name: ipscan-site
    restart: unless-stopped
    ports:
      - '127.0.0.1:26014:80'
    volumes:
      - ./public:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    networks:
      - firawynix_frontend-net
networks:
  firawynix_frontend-net:
    external: true
