server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header X-Frame-Options DENY always;
  add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
  add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; script-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
  location = /healthz { access_log off; return 200 'ok'; add_header Content-Type text/plain; }
  location /downloads/ { try_files $uri =404; add_header Content-Disposition 'attachment' always; add_header Cache-Control 'public, max-age=300' always; }
  location / { try_files $uri $uri/ =404; }
}
